<div [ngClass]="embedded ? 'dm-page-wrap' : 'audit-page'">
  <div [ngClass]="embedded ? 'dm-page-inner' : 'audit-inner'">
    <div [ngClass]="embedded ? 'main-card shadow-lg rounded-4 bg-white p-4' : 'audit-shell'">

      <div class="audit-hero" [class.embedded]="embedded">
        <div>
          <p class="audit-kicker">Audit Center</p>
          <h2>Admin Activity Log</h2>
          <p class="audit-subtitle">{{ total }} record(s) · {{ filterSummary }}</p>
        </div>
        <div class="hero-stats">
          <div class="stat-pill">
            <span>Pages</span>
            <strong>{{ allPages.length }}</strong>
          </div>
          <div class="stat-pill">
            <span>Showing</span>
            <strong>{{ pageOptions.length }}</strong>
          </div>
        </div>
      </div>

      <div class="filter-panel">
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label">Login type</label>
            <select class="form-control" [(ngModel)]="mcorhqType">
              <option *ngFor="let opt of mcorhqOptions" [value]="opt.value">{{ opt.label }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Officer name</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="empName"
              placeholder="All officers"
              autocomplete="off"
            />
          </div>
          <div class="col-md-3">
            <label class="form-label">Module</label>
            <select class="form-control" [(ngModel)]="moduleName" (ngModelChange)="onModuleChange()">
              <option *ngFor="let m of moduleOptions" [value]="m">{{ m || 'All modules' }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Category</label>
            <select class="form-control" [(ngModel)]="categoryName" (ngModelChange)="onCategoryChange()">
              <option *ngFor="let c of categoryOptions" [value]="c">{{ c || 'All categories' }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Page</label>
            <select class="form-control" [(ngModel)]="routePath">
              <option value="">All pages ({{ pageOptions.length }})</option>
              <option *ngFor="let p of pageOptions" [value]="p.route_path">{{ pageLabelFor(p) }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">From</label>
            <input type="date" class="form-control" [(ngModel)]="fromDate" [max]="maxDate" />
          </div>
          <div class="col-md-3">
            <label class="form-label">To</label>
            <input type="date" class="form-control" [(ngModel)]="toDate" [max]="maxDate" />
          </div>
          <div class="col-md-3 d-flex">
            <button type="button" class="btn btn-primary w-100" (click)="applyFilters()" [disabled]="loading">
              Apply Filters
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>

      <div class="timeline-section">
        <app-activity-log-timeline
          [logs]="logs"
          [loading]="loading"
          emptyMessage="No activity logs found for the selected filters."
        ></app-activity-log-timeline>
      </div>

      <div class="d-flex justify-content-between align-items-center py-3" *ngIf="total > limit">
        <button class="btn btn-outline-primary btn-sm" (click)="prevPage()" [disabled]="offset === 0 || loading">
          Previous
        </button>
        <span>{{ pageLabel }}</span>
        <button class="btn btn-outline-primary btn-sm" (click)="nextPage()" [disabled]="offset + limit >= total || loading">
          Next
        </button>
      </div>

    </div>
  </div>
</div>

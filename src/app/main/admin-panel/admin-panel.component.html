<!-- src/app/main/admin-panel/admin-panel.component.html -->
<div class="ap-layout">

  <app-header></app-header>

  <div class="ap-body">

    <!-- SIDEBAR -->
    <nav class="ap-sidebar" [class.collapsed]="!isExpanded"
         (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">

      <!-- Logo / hamburger row -->
      <div class="sb-logo">
        <button class="sb-hamburger" (click)="togglePin()" [title]="isPinned ? 'Unpin sidebar' : 'Pin sidebar open'">
          <i class="bi" [ngClass]="isPinned ? 'bi-x-lg' : 'bi-list'"></i>
        </button>
        <span class="sb-logo-text">Admin Panel</span>
      </div>

      <div class="sb-scroll">
        <ng-container *ngFor="let item of menuItems">

          <!-- Plain link (no children) -->
          <ng-container *ngIf="!item.children">
            <a class="sb-plain"
               [routerLink]="item.route"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{exact:false}"
               [title]="!isExpanded ? item.label : ''">
              <i [class]="item.icon + ' sb-icon'"></i>
              <span class="sb-label">{{ item.label }}</span>
            </a>
          </ng-container>

          <!-- Expandable group -->
          <ng-container *ngIf="item.children">
            <div class="sb-parent" [class.open]="item.expanded"
                 (click)="toggleSubmenu(item)" [title]="!isExpanded ? item.label : ''">
              <i [class]="item.icon + ' sb-icon'"></i>
              <span class="sb-label">{{ item.label }}</span>
              <i class="bi bi-chevron-down sb-chevron" [class.down]="item.expanded"></i>
            </div>

            <div class="sb-children" [class.open]="item.expanded">
              <a *ngFor="let child of item.children"
                 class="sb-child"
                 [routerLink]="child.route"
                 routerLinkActive="active"
                 [routerLinkActiveOptions]="{exact:false}">
                <i [class]="child.icon"></i>
                <span>{{ child.label }}</span>
              </a>
            </div>
          </ng-container>

        </ng-container>
      </div>

    </nav>

    <!-- CONTENT -->
    <div class="ap-content flex-grow-1 overflow-auto">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>

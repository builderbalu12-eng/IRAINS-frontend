      <td style="text-align: center; padding: 20px 0px 20px 20px; width: 75%">
        <div
          style="
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
          "
        >
          <!-- Left Image -->
          <img
            src="/assets/images/IMDlogo_Ipart-iris.png"
            width="100"
            height="100"
            style="
              object-fit: contain;
              filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.4));
            "
            alt="IMD Logo Left"
          />

          <!-- Heading and Subheading -->
          <div style="text-align: center">
            <div
              style="
                color: #ffffff;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-weight: 600;
                font-size: 30px;
                letter-spacing: 0.5px;
              "

              IMD Rainfall Information System
            </div>
            <div
              style="
                color: #ffffff;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-weight: 550;
                font-size: 24px;
                letter-spacing: 0.5px;
              "
            >
              Hydromet Division
            </div>
          </div>

          <!-- Right Image -->
          <img
            src="/assets/images/IMD150(BGR).png"
            width="90"
            height="90"
            style="
              object-fit: contain;
              filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.4));
            "
            alt="IMD Logo Right"
          />
        </div>

      <td>

          <button class="Logout" (click)="logOut()" id="usrLout">Logout</button>
          <button class="Back" (click)="selectMode()">Back</button>
        </div>

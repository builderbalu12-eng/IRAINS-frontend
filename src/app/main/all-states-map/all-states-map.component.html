
<div id="loader" class="loader" *ngIf="isLoading">
  <div class="loading-message">
    <i class="fa fa-spinner fa-pulse fa-3x fa-fw"></i> Loading...
  </div>
</div>

<div class="wholebody">

    <app-header></app-header>
  
    <h2 class="text-center text-primary mt-2">STATE WISE RAINFALL MAP</h2>
  
    <div class="container mt-4">
      <!-- Form Row (Date, State, and Submit Button in a single row) -->
      <div class="row justify-content-center align-items-center mb-3">
        <!-- Date Input -->

        <div class="col-md-3 col-sm-6 col-12 mb-3 mb-md-0">
          <span for="dateInput" class="fw-bold">From Date</span>
          <input
            type="date"
            id="dateInput"
            class="form-control"
            [(ngModel)]="fromDate"
            placeholder="Select date"
          />
        </div>


        <div class="col-md-3 col-sm-6 col-12 mb-3 mb-md-0">
          <span for="dateInput" class="fw-bold">End Date</span>
          <input
            type="date"
            id="dateInput"
            class="form-control"
            [(ngModel)]="toDate"
            placeholder="Select date"
          />
        </div>
  
        <!-- State Select -->
        <div class="col-md-4 col-sm-6 col-12 mb-md-0">
          <span for="stateSelect" class="fw-bold">Select State</span>
  
          <!-- Dropdown Row (Centered) -->
          <div class="row justify-content-center">
            <div class="">
              <select
                id="selectRMCs"
                class="form-select"
                (change)="onSelectChange($event)"
              >
                <option *ngFor="let key of listOfmsRMCs" [value]="key">
                  {{ key }}
                </option>
              </select>
            </div>
          </div>
        </div>
  
        <!-- Submit Button -->
        <div class="col-md-2 col-sm-6 col-12 d-flex mt-3 justify-content-center">
          <button type="button" class="btn btn-primary mt-md-0" (click)="onSubmit()">
            Submit
          </button>
        </div>
      </div>
    </div>
  
    <div class="container">
      <div class="row">
        <div class="col-12" id="mapdiv1-ftp">
          <div class="map-container">
            <div
              class="map-frame d-flex align-items-center justify-content-center"
            >
              <div
                id="map-district-all-statemaps"
                class="text-center shadow-sm bg-white"
                style="width: 44rem; height: 58.8rem; padding: 1rem"
              >
  
              <div
              style="
                border: 2px solid black;
                width: 100%;
                height: 100%;
                padding: 2em;
              "
              id="border-remove-subdivisionRainfallMap"
            >
                <div id="loader" class="loader" *ngIf="isDownloading">
                  <div class="loading-message">
                    <i class="fa fa-spinner fa-pulse fa-3x fa-fw"></i>
                    Downloading...
                  </div>
                </div>
  
                <div class="d-flex w-100">
                  <div class="text-center ms-2" style="width: 15%">
                    <img
                      id="logoImage-district"
                      class=""
                      src="/assets/images/IMDlogo_Ipart-iris.png"
                      alt=""
                    />
                    <div *ngIf="!isFullscreen()" class="download-buttons">
                      <div id="all-btn-district" class="d-flex flex-column mt-3">
                        <button
                          mat-button
                          class="mode-button mb-2"
                          (click)="downloadMapImage(false)"
                        >
                          Map Download
                        </button>
                        <button
                          mat-button
                          class="mode-button mb-2"
                          (click)="downloadMappdf()"
                        >
                          Map Pdf Download
                        </button>
                        <button
                          mat-button
                          class="mode-button mb-2"
                          (click)="downloadMapData()"
                        >
                          Statistics Download
                        </button>
                        <button
                          mat-button
                          class="mode-button mb-2 custom-z-index"
                          (click)="resetMapSmallScreen()"
                        >
                          Reset Position
                        </button>
                      </div>
                    </div>
                  </div>
  
                  <div
                    id="middle-header-district"
                    class="text-center pt-3"
                    style="width: 72%"
                  >
                    <div class="d-flex flex-column align-items-center ps-4">
                      <div>
                        <label
                          class="text-black fw-bold"
                          style="font-family: Arial; font-size: 12px"
                        >
                          भारत मौसम विज्ञान विभाग
                          <br>
                          INDIA METEOROLOGICAL DEPARTMENT, NEW DELHI
                          <br>
                          जल मौसम विज्ञान प्रभाग, नई दिल्ली
                          <br>
                          Hydromet Division, New Delhi
                        </label>
                      </div>
                      <div>
                        <label
                          *ngIf="!StartDate && !EndDate"
                          class="text-black fw-bold"
                          style="font-family: Arial; font-size: 14px"
                        >
                          Date : {{ formatteddate }}
                        </label>
                        <label
                          *ngIf="StartDate && EndDate && StartDate != EndDate"
                          class="text-black fw-bold"
                          style="font-family: Arial; font-size: 14px"
                        >
                          Date :
                          {{ StartDate | date: "dd-MM-yyyy" }} to
                          {{ EndDate | date: "dd-MM-yyyy" }}
                        </label>
                        <label
                          *ngIf="StartDate && StartDate == EndDate"
                          class="text-black fw-bold"
                          style="font-family: Arial; font-size: 14px"
                        >
                          Date : {{ StartDate | date: "dd-MM-yyyy" }}
                        </label>
                      </div>
                      <div>
                        <label
                          class="text-black fw-bold"
                          style="font-family: Arial; font-size: 14px"
                        >
                          {{selectedStateName}} DISTRICT WISE RAINFALL MAP (mm)
                        </label>
                      </div>
                    </div>
                  </div>
  
                  <div
                    *ngIf="isFullscreen()"
                    id="resetButton"
                    class="ResetMap text-center"
                    style="width: 72%"
                  >
                    <button
                      mat-button
                      class="mode-button w-25"
                      (click)="resetMap()"
                    >
                      Reset Position
                    </button>
                  </div>
  
                  <div>
                    <div id="celebrations-district" class="text-center mt-3 ms-1">
                      <img
                        class="logo"
                        src="assets/images/IMD150(BGR).png"
                        alt=""
                      />
                    </div>
        
                    <img
                      class="mt-5 ms-1 img-fluid small-img"
                      style="width: 100px; height: 100px"
                      src="../../assets/images/—Pngtree—compass_6028609.png"
                      alt=""
                      id="compassArrow-district"
                    />
                  </div>

                <div class="leaflet-bottom" id="leaflet-bottom-district">
                  <div
                    class="info_legend leaflet-control justify-content-center d-flex align-items-center flex-wrap mb-5"
                    id="legends-district"
                    style="width: auto; height: 30px"
                  >
                    <div
                      *ngFor="let item of legendItems"
                      class="d-flex align-items-center me-3"
                    >
                      <div
                        [style.background-color]="item.color"
                        class="d-inline-block"
                        style="width: 11px; height: 11px"
                      ></div>
                      <div
                        [style.font-size]="item.fontSize"
                        class="text-black fw-bold mx-2"

                        <span [innerHTML]="item.text"></span>

              </div>
            </div>

    </div>
  </div>

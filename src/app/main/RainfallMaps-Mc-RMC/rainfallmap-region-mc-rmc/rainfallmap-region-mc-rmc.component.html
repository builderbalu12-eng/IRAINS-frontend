<div class="wholebody">
  <div *ngIf="showHeader">
    <app-header></app-header>
  </div>

  <div class="values container">
    <div class="row">
        <div class="col-md-5">
            <label class="form-label">From Date</label>
            <input type="date" class="form-control" [(ngModel)]="fromDate"  placeholder="Select date" [max]="today"/>
        </div>
        <div class="col-md-5">
            <label class="form-label">To Date</label>
            <!-- <input type="date" class="form-control" [(ngModel)]="toDate" (ngModelChange)="validateToDateRange()" placeholder="Select date"  [max]="today"/> -->
            <input type="date" class="form-control" [(ngModel)]="toDate" placeholder="Select date"  [max]="today"/>

        </div>
        <div class="col-md-2">
            <button type="button" class="btn btn-primary mt-md-4 mt-2" (click)="setFromAndToDate()">
      Submit
    </button>
        </div>
    </div>
</div>


<div class="container pt-3">
    <div class="row">
      <div class="col-12" id="mapdiv1-ftp">
        <div class="map-container">
          <div class="map-frame d-flex align-items-center justify-content-center">
            <div
            id="map-MC-RMC-region-ftp_dup"
            class="text-center shadow-sm bg-white"
            style="width: 44rem; height: 58.8rem; padding: 1rem"
          >

          <div
          style="
            border: 2px solid black;
            width: 100%;
            height: 100%;
            padding: 2em;
          "
          id="border-remove-subdivisionRainfallMap"
        >

            <div id="loader" class="loader" *ngIf="isLoading">
              <div class="loading-message">
                <i class="fa fa-spinner fa-pulse fa-3x fa-fw"></i> Downloading...
              </div>
            </div>
  
  
              <div class="d-flex w-100">
                <div class="text-center ms-2" style="width: 15%;">
                  <img id="logoImage-MC-RMC-region"  src="/assets/images/IMDlogo_Ipart-iris.png" alt="" />
                  <div *ngIf="!isFullscreen()" class="download-buttons">
                    <div id="all-btn-district" class="d-flex flex-column mt-3">
                      <button mat-button class="mode-button mb-2" (click)="downloadMapImage(false)">
                          Map Download
                      </button>
                      <button mat-button class="mode-button mb-2" (click)="downloadMappdf()">
                          Map Pdf Download
                      </button>
                      <button mat-button class="mode-button mb-2" (click)="downloadMapData()">
                          Statistics Download
                      </button>
                      <button mat-button class="mode-button mb-2 custom-z-index" (click)="resetMapSmallScreen()">
                        Reset Position
                    </button>
                  </div>
                  </div>
                </div>
  
                <div id="middle-header-MC-RMC-region" class="text-center pt-3" style="width: 72%;">
                  <div class="d-flex flex-column align-items-center ps-4">
                    <div>
                      <label class="text-black fw-bold" style="font-family: Arial; font-size: 12px;">
                        INDIA METEOROLOGICAL DEPARTMENT, NEW DELHI
                      </label>
                    </div>
                    <div>
                      <label
                        *ngIf="!StartDate && !EndDate"
                        class="text-black fw-bold"
                        style="font-family: Arial; font-size: 14px;"
                      >
                        Date : {{ formatteddate }}
                      </label>
                      <label
                        *ngIf="
                          StartDate &&
                          EndDate &&
                          StartDate != EndDate
                        "
                        class="text-black fw-bold"
                        style="font-family: Arial; font-size: 14px;"
                      >
                        Date :
                        {{ StartDate }} to
                        {{ EndDate  }}
                      </label>
                      <label
                        *ngIf="
                          StartDate &&
                          StartDate == EndDate
                        "
                        class="text-black fw-bold"
                        style="font-family: Arial; font-size: 14px;"
                      >
                        Date : {{ StartDate}}
                      </label>
                    </div>
                    <div>
                      <label class="text-black fw-bold" style="font-family: Arial; font-size: 14px;">
                         REGION WISE RAINFALL MAP (mm)
                      </label>
                    </div>
                  </div>
                </div>
  
                <div *ngIf="isFullscreen()" id="resetButton-MC-RMC-region" class="ResetMap text-center" style="width: 72%;">
                  <button mat-button class="mode-button w-25" (click)="resetMap()">
                    Reset Position
                </button>
              </div>
                
                <div>
                  <div id="celebrations-MC-RMC-region" class="text-center mt-3 ms-1">
                    <img class="logo" src="assets/images/IMD150(BGR).png" alt="" />
                  </div>     
        
                  <img
                  class="mt-5 ms-1 img-fluid small-img"
                  style="width: 100px; height: 100px;"
                  src="../../assets/images/—Pngtree—compass_6028609.png"
                  alt=""
                  id="compassArrow-MC-RMC-region"
                  />
                </div>
      
              </div>
  
              <div class="leaflet-bottom" id="leaflet-bottom-MC-RMC-region">
                <div
                class="info_legend leaflet-control justify-content-center d-flex align-items-center flex-wrap mb-5"
                id="legends-district"
                  style="width: auto; height: 30px;"
                >
                  <div
                    *ngFor="let item of legendItems"
                    class="d-flex align-items-center me-3"
                  >
                    <div
                      [style.background-color]="item.color"
                      class="d-inline-block"
                      style="width: 11px; height: 11px;"
                    ></div>
                    <div
                      [style.font-size]="item.fontSize"
                      class="text-black fw-bold mx-2"
                    >
                    <span [innerHTML]="item.text"></span>
                    <!-- {{ item.text }} -->
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

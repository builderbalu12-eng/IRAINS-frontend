<div class="main-body">
    <!-- <app-front-page></app-front-page> -->


    <div *ngIf="selecteddatamode == 'Departure'">
        <div *ngIf="loggedInUserObject.data[0].mcorhq == 'mc'">
            <app-mc-rmc-map-component-for-mcs-dup></app-mc-rmc-map-component-for-mcs-dup>
        </div>
    </div>

    <div *ngIf="selecteddatamode == 'Actual'">
        <div *ngIf="loggedInUserObject.data[0].mcorhq == 'mc'">
            <app-mc-rmc-map-component-for-mcs-actual-dup></app-mc-rmc-map-component-for-mcs-actual-dup>
        </div>
    </div>




    <div *ngIf="selecteddatamode == 'Departure'">
        <div *ngIf="loggedInUserObject.data[0].mcorhq == 'hq' || loggedInUserObject.data[0].mcorhq == 'sp' || loggedInUserObject.data[0].mcorhq == 'public'" class="d-flex justify-content-center flex-wrap gap-3">
            <app-district-map-dup></app-district-map-dup>
            <app-state-map-dup></app-state-map-dup>
            <app-subdivision-map-dup></app-subdivision-map-dup>
            <app-region-map-dup></app-region-map-dup>
            <!-- <app-country-map-dup></app-country-map-dup> -->
        </div>
    </div>
    
    <div *ngIf="selecteddatamode =='Actual'">
        <div *ngIf="loggedInUserObject.data[0].mcorhq == 'hq' || loggedInUserObject.data[0].mcorhq == 'sp' || loggedInUserObject.data[0].mcorhq == 'public'" class="d-flex justify-content-center flex-wrap gap-3">
            <app-district-actual-map-dup></app-district-actual-map-dup>
            <app-state-actual-map-dup></app-state-actual-map-dup>
            <app-subdivision-actual-map-dup></app-subdivision-actual-map-dup>
            <app-region-actual-map-dup></app-region-actual-map-dup>
        </div>    
    </div>
</div>

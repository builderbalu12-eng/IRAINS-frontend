<div class="wholebody">
    <app-header></app-header>
  
    <div class="pt-5 pb-1">
        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="d-flex align-items-center">
                        <mat-form-field appearance="fill" class="me-3 flex-fill">
                            <mat-label>Select State</mat-label>
                            <mat-select [(ngModel)]="selectedState" (ngModelChange)="onStateChange($event)">
                                <mat-option *ngFor="let state of States" [value]="state">
                                    {{ state.state_name }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
  
                        <mat-form-field appearance="fill" class="me-3 flex-fill">
                            <mat-label>Select District</mat-label>
                              <mat-select [(ngModel)]="selectedDistrict" (ngModelChange)="onDistrictChange($event)">
                                <mat-option *ngFor="let district of filteredDistricts" [value]="district.district_code">
                                    {{ district.district_name }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
  
                        <div class="pb-4">
                        <button mat-raised-button color="primary" (click)="fetchRainfallData()">Submit</button>
                        </div>
  
                    </div>
                </div>
  
                <div class="table-responsive mt-3">
                    <table mat-table [dataSource]="years" class="mat-elevation-z8" style="width: 90rem; height: 8rem;">
                        <ng-container matColumnDef="year">
                            <th mat-header-cell *matHeaderCellDef class="year-column fs-5"> YEAR </th>
                            <td mat-cell *matCellDef="let year" class="fs-5">{{ year }}</td>
                        </ng-container>
  
                       
                        <ng-container *ngFor="let month of ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']" 
                                     matColumnDef="{{ month }}">
                           <th mat-header-cell *matHeaderCellDef class="month-column"> <span class="fs-5">{{ month }}</span> <br> <span class="no-wrap">R/F--Dep%</span> </th>
                            <td mat-cell *matCellDef="let year">
                                <div *ngIf="yearMonthData[year][month]" class="fs-6">
                                    {{ (yearMonthData[year][month].actual_rainfall)?.toFixed(2) || ' ' }} /
                                    {{ (yearMonthData[year][month].departure)?.toFixed(2) || ' ' }}
                                </div>
                                <div *ngIf="!yearMonthData[year][month]">
                                    N/A / N/A
                                </div>
                            </td>
                        </ng-container>
  
                        <tr mat-header-row *matHeaderRowDef="['year', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']"></tr>
                        <tr mat-row *matRowDef="let row; columns: ['year', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']"></tr>
                    </table>
                </div>
                
            </div>
        </div>
    </div>
  </div>

<div class="container">
  <div class="row">
    <div class="col-12" id="mapdiv3-actual-region">
      <div class="map-container">
        <div class="map-frame">
          <div
            id="map-actual-region"
            class="text-center shadow-sm bg-white"
            style="width: 44rem; height: 58.8rem; padding: 1rem"
          >
            <div
              style="
                border: 2px solid black;
                width: 100%;
                height: 100%;
                padding: 2em;
              "
              id="border-remove-region"
            >
              <div id="loader" class="loader" *ngIf="isLoading">
                <div class="loading-message">
                  <i class="fa fa-spinner fa-pulse fa-3x fa-fw"></i>
                  Downloading...
                </div>
              </div>

              <div class="d-flex w-100">
                <div class="text-center ms-2" style="width: 15%">
                  <img
                    id="logoImage3"
                    class=""
                    src="/assets/images/IMDlogo_Ipart-iris.png"
                    alt=""
                  />
                  <div *ngIf="!isFullscreen()" class="download-buttons">
                    <div id="all-btn-region" class="d-flex flex-column mt-3">
                      <button
                        mat-button
                        class="mode-button mb-2"
                        (click)="downloadMapImage(false)"
                      >
                        Map Download
                      </button>
                      <button
                        mat-button
                        class="mode-button mb-2"
                        (click)="downloadMappdf()"
                      >
                        Map Pdf Download
                      </button>
                      <button
                        mat-button
                        class="mode-button mb-2"
                        (click)="downloadMapData()"
                      >
                        Statistics Download
                      </button>
                      <button
                        mat-button
                        class="mode-button mb-2 custom-z-index"
                        (click)="resetMapSmallScreen()"
                      >
                        Reset Position
                      </button>
                    </div>
                  </div>
                </div>
                <div
                  id="middle-header-region"
                  class="text-center pt-3"
                  style="width: 72%"
                >
                  <div class="d-flex flex-column align-items-center ps-4">
                    <div>
                      <label
                        class="text-black fw-bold"
                        style="font-family: Arial; font-size: 12px"
                      >
                        INDIA METEOROLOGICAL DEPARTMENT, NEW DELHI
                      </label>
                    </div>
                    <div>
                      <label
                        *ngIf="!StartDate && !EndDate"
                        class="text-black fw-bold"
                        style="font-family: Arial; font-size: 14px"
                      >
                        Date : {{ formatteddate }}
                      </label>
                      <label
                        *ngIf="StartDate && EndDate && StartDate != EndDate"
                        class="text-black fw-bold"
                        style="font-family: Arial; font-size: 14px"
                      >
                        Date :
                        {{ StartDate }} to
                        {{ EndDate }}
                      </label>
                      <label
                        *ngIf="StartDate && StartDate == EndDate"
                        class="text-black fw-bold"
                        style="font-family: Arial; font-size: 14px"
                      >
                        Date : {{ StartDate }}
                      </label>
                    </div>
                    <div>
                      <label
                        class="text-black fw-bold"
                        style="font-family: Arial; font-size: 14px"
                      >
                        REGION WISE NORMAL RAINFALL MAP (mm)
                      </label>
                    </div>
                  </div>
                </div>

                <div
                  *ngIf="isFullscreen()"
                  id="resetButton"
                  class="ResetMap text-center"
                  style="width: 72%"
                >
                  <button
                    mat-button
                    class="mode-button w-25"
                    (click)="resetMap()"
                  >
                    Reset Position
                  </button>
                </div>

                <div>
                  <div id="celebrations-region" class="text-center mt-3 ms-1">
                    <img
                      class="logo"
                      src="assets/images/IMD150(BGR).png"
                      alt=""
                    />
                  </div>

                  <div>
                    <img
                      class="mt-5 ms-1 img-fluid small-img"
                      style="width: 100px; height: 100px"
                      src="../../assets/images/—Pngtree—compass_6028609.png"
                      alt=""
                      id="compassArrow-region"
                    />
                  </div>
                </div>

                <div>
                  <div
                    id="country_values_region_allmaps"
                    *ngIf="isFullscreen()"
                    class="text-center mt-3 ms-1"
                  >
                    <p
                      style="
                        text-align: center;
                        font-weight: bold;
                        font-size: xx-large;
                        color: #ff9933;
                      "
                    ></p>
                    <!-- <table style="border: 1px solid black; border-collapse: collapse; width: 10px;">
                      <tr>
                        <th style="border: 2px solid black;" class="px-2">Actual</th>
                        <th style="border: 2px solid black;" class="px-2">Normal</th>
                        <th style="border: 2px solid black;" class="px-2 text-nowrap">% Dep.</th>
                      </tr>
                      <tr>
                        <td style="border: 2px solid black; color: #000080; ">{{countryActual==-999 || countryActual==null ? 'No Data' : countryActual}}</td>
                        <td style="border: 2px solid black; color: #000080;">{{countryNormal==-999 || countryNormal==null ? 'No Data' : countryNormal}}</td>
                        <td style="border: 2px solid black; color: #000080;">{{countryDeparture==-999 || countryDeparture==null ?'No Data' : countryDeparture}}</td>
                      </tr>
                    </table>  -->
                  </div>
                </div>

                <!-- <div id="all-btn-region" class="d-flex flex-column me-2 text-start w-25">
                  <div class="d-flex">
                    <button class="download" style="margin-right: 5px;" (click)="downloadMapImage(false)">
                      IMG
                    </button>
                    <button class="download" style="margin-left: 5px;" (click)="downloadMappdf()">
                      PDF
                    </button>
                  </div>
                  <div class="mt-1 text-start">
                    <button class="download" style="margin-left: 10px;" (click)="downloadMapData()">
                      Statistics
                    </button>
                  </div>
                </div>
              </div> -->

                <div class="leaflet-bottom" id="leaflet-bottom-region">
                  <!-- <div
                class="info_legend leaflet-control mx-auto justify-content-center d-flex align-items-center flex-wrap mb-5"
                id="legends-region"
                  style="width: auto; height: 18px; margin-bottom: 3px;"
                >
                  <div
                    *ngFor="let item of legendItems"
                    class="d-flex align-items-center me-4"
                  >
                    <div
                      [style.background-color]="item.color"
                      class="d-inline-block border border-1 border-black"
                      style="width: 9px; height: 9px;"
                    ></div>
                    <div
                      [style.font-size]="item.fontSize"
                      class="text-black fw-bold mx-1"
                    >
                    <div class="text-width" [innerHTML]="item.text"></div>
                    </div>
                  </div>
                </div> -->
                  <div
                    class="info_legend leaflet-control d-flex flex-nowrap align-items-center mb-4 px-2 py-1"
                    id="legends-district"
                    style="width: auto; height: auto; overflow-x: auto"
                  >
                    <div
                      *ngFor="let item of legendItems"
                      class="d-flex align-items-center me-2"
                      style="white-space: nowrap"
                    >
                      <div
                        [style.background-color]="item.color"
                        class="d-inline-block"
                        style="width: 12px; height: 12px; border-radius: 2px"
                      ></div>
                      <div
                        [style.font-size]="item.fontSize || '10px'"
                        class="text-black fw-semibold mx-1"
                      >
                        <span [innerHTML]="item.text"></span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div  class="wholebody">
    <app-header></app-header>
     
    <div class="pt-3 pb-1">
      <!-- <h4 class="text-center pb-3 text-primary">
        Please select date to see particular date's data
      </h4> -->
      <div class="values container shadow-lg">
        <div class="row g-3 align-items-end">
          <div class="col-md-8">
            <label class="form-label">Select Date</label>
            <input
              type="date"
              class="form-control"
              [(ngModel)]="fromDate"
              placeholder="Select date"
              [max]="today"
            />
          </div>
          <div class="col-md-4 d-flex justify-content-start">
            <button
              type="button"
              class="btn btn-primary w-100"
              (click)="setFromAndToDate()"
            >
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>

<!--
  Split layout: map (left) + statistics panel (right). To revert to the
  original centered-map-only page: delete the "col stats-col"
  block below (down to "RIGHT PANEL END"), change "col-auto"
  back to "col-12", and in the .ts file delete the fields/method between
  the "RIGHT PANEL" comment markers plus the two `this.loadStats();`
  call sites.
-->
<div class="container-fluid map-stats-wrap">
    <div class="row justify-content-center g-2 align-items-stretch">
      <div class="col-auto" id="mapCountryNavbar">
        <div class="map-container">
          <div class="map-frame d-flex justify-content-center">
            <div
              id="map-country-Navbar"
              class="text-center shadow-sm bg-white" style="width: 44rem; height: 58.8rem; padding: 1rem"
  
            >
  

            <div
            style="
              border: 2px solid black;
              width: 100%;
              height: 100%;
              padding: 2em;
            "
            id="border-remove-CountryNavbar"
          >
  
            <div id="loaderCountryNavbar" class="loader" *ngIf="isLoading">
              <div class="loading-message">
                <i class="fa fa-spinner fa-pulse fa-3x fa-fw"></i> Downloading...
              </div>
            </div>
  
            
              <div class="d-flex w-100">
                <div class="text-center ms-2 pt-3" style="width: 15%;">
                  <img id="logoImageCountryNavbar" class="logo" src="/assets/images/IMDlogo_Ipart-iris.png" alt="" />
  
                  <div *ngIf="!isFullscreen()" class="download-buttons">
                    <div id="all-btn-countryNavbar" class="d-flex flex-column mt-3">
                      <button mat-button class="mode-button mb-2" (click)="downloadMapImage(false)">
                          Map Download
                      </button>
                      <button mat-button class="mode-button mb-2" (click)="downloadMappdf()">
                          Map Pdf Download
                      </button>
                      <button mat-button class="mode-button mb-2" (click)="downloadMapData()">
                          Statistics Download
                      </button>
                      <button mat-button class="mode-button mb-2 custom-z-index" (click)="resetMapSmallScreen()">
                        Reset Position
                    </button>
                  </div>
                  </div>
  
                </div>
                <div id="middle-header-countryNavbar" class="text-center" style="width: 72%;">
                  <div class="d-flex flex-column align-items-center ps-4">
                    <div>
                      <label class="text-black fw-bold" style="font-family: Arial; font-size: 12px;">
                        भारत मौसम विज्ञान विभाग
                        <br>
                        INDIA METEOROLOGICAL DEPARTMENT, NEW DELHI
                        <br>
                        जल मौसम विज्ञान प्रभाग, नई दिल्ली
                        <br>
                        Hydromet Division, New Delhi
                      </label>
                    </div>
                    <div>
                      <label
                        class="text-black fw-bold"
                        style="font-family: Arial; font-size: 14px;"
                      >
                        Date : {{ formatteddate }}
                      </label>

                    </div>
                    <div>
                      <label class="text-black fw-bold" style="font-family: Arial; font-size: 14px;">
                        COUNTRY WISE DEPARTURE RAINFALL MAP (mm)
                      </label>
                    </div>
                  </div>
                </div>
  
                <div *ngIf="isFullscreen()" id="resetButton-countryNavbar" class="ResetMap text-center" style="width: 72%;">
                  <button mat-button class="mode-button w-25" (click)="resetMap()">
                    Reset Position
                </button>
              </div>
  
                <div>
                <div id="celebrations-countryNavbar" class="text-center mt-3 ms-1">
                  <img class="logo" src="assets/images/IMD150(BGR).png" alt="" />
                </div>     
  
                <div>
                  <!-- <img
                    class="mt-2 ms-1"
                    style="width: 150px; height: 150px;"
                    src="../../assets/images/—Pngtree—compass_6028609.png"
                    alt=""
                    id="compassArrow-country"
                  /> -->
  
                  <img
                  class="mt-5 ms-1 img-fluid small-img"
                  style="width: 100px; height: 100px;"
                  src="../../assets/images/—Pngtree—compass_6028609.png"
                  alt=""
                  id="compassArrow-countryNavbar"
                  />
  
                </div>
              </div>

              <div id="all-btn-country" class="d-flex flex-column mt-3">
                <button mat-button class="mode-button mb-2" (click)="downloadMapImage(false)">
                    Map Download
                </button>
                <button mat-button class="mode-button mb-2" (click)="downloadMappdf()">
                    Map Pdf Download
                </button>
                <button mat-button class="mode-button" (click)="downloadMapData()">
                    Statistics Download
                </button>
              </div>
            </div> -->

                  <div class="d-flex">
                    <button class="download" style="margin-right: 5px;" (click)="downloadMapImage(false)">
                      IMG
                    </button>
                    <button class="download" style="margin-left: 5px;" (click)="downloadMappdf()">
                      PDF
                    </button>
                  </div>
                  <div class="mt-1 text-start">
                    <button class="download" style="margin-left: 10px;" (click)="downloadMapData()">
                      Statistics
                    </button>
                  </div>
                </div>
              </div> -->
  
              <div class="leaflet-bottom" id="leaflet-bottom-countryNavbar">
                <div
                class="info_legend leaflet-control justify-content-center d-flex align-items-center flex-wrap mb-5"
                id="legends-countryNavbar"
                  style="width: auto; height: 30px;"
                >
                  <div
                    *ngFor="let item of legendItems"
                    class="d-flex align-items-center me-3"
                  >
                    <div
                      [style.background-color]="item.color"
                      class="d-inline-block"
                      style="width: 11px; height: 11px;"
                    ></div>
                    <div
                      [style.font-size]="item.fontSize"
                      class="text-black fw-bold mx-2"
                    >
                    <span [innerHTML]="item.text"></span>
                    <!-- {{ item.text }} -->
                  </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

      <!-- RIGHT PANEL START -->
      <div class="col stats-col">
        <app-rainfall-stats-panel
          title="DAILY COUNTRY DEPARTURE STATISTICS"
          entityLabel="Country"
          [loading]="statsLoading"
          [showTable]="showStatsTable"
          [dayLabel]="dayLabel"
          [periodLabel]="periodLabel"
          [rows]="tableRows"
        ></app-rainfall-stats-panel>
      </div>
      <!-- RIGHT PANEL END -->
</div>
</div>

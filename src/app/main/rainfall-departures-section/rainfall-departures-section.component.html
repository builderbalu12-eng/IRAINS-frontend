<div class="wholepage">
<div class="wholebody">
  <app-header></app-header>
</div>

<div class="mt-3 mb-0 p-3 bg-light rounded align-items-center justify-content-center">
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-6 align-items-center justify-content-center">




  <mat-form-field appearance="fill" class="me-3 ">
    <mat-label>Select Mode</mat-label>
    <mat-select [(ngModel)]="selectedMode">
        <mat-option *ngFor="let mode of modes" [value]="mode">
            {{ mode }}
        </mat-option>
    </mat-select>
</mat-form-field>


<mat-form-field appearance="fill" class="me-3 ">
  <mat-label>Select Map</mat-label>
  <mat-select [(ngModel)]="selectedMap">
      <mat-option *ngFor="let map of maps" [value]="map">
          {{ map }}
      </mat-option>
  </mat-select>
</mat-form-field>



<mat-form-field appearance="fill" class="me-3 ">
<mat-label>Select Season</mat-label>
<mat-select [(ngModel)]="selectedSeason">
    <mat-option *ngFor="let season of seasons" [value]="season">
        {{ season }}
    </mat-option>
</mat-select>
</mat-form-field>


<mat-form-field appearance="fill" class="me-3 ">
  <mat-label>Select Year</mat-label>
  <mat-select [(ngModel)]="selectedYear">
      <mat-option *ngFor="let year of years" [value]="year">
          {{ year }}
      </mat-option>
  </mat-select>
  </mat-form-field>

  <div class="col mb-2 ">
    <button
      class="btn btn-success w-50"
      type="button"
      (click)="onSubmitButton()"
    >
      Submit
    </button>
  </div>
</div>
</div>

<div class="container-fluid">
  <div style="text-align: center; padding-top: 40px">
    <div class="dataentry">



      <!-- Table Section -->
      <div class="row justify-content-center align-items-center">
        
          <div class="col-md-5 col-sm-6 mb-3 border border-black p-3 rounded d-flex justify-content-end">
            <div>
              <h4>{{title}}</h4>
              <h6>{{periodTitle}}</h6>
            </div>


            <div class="col-md-2 col-sm-6 mb-3">
              <button class="btn btn-primary" (click)="onDownload()">
                Download
              </button>
            </div>  
          </div>         
        </div>


      <div class="overflow-x-scroll">
        <table style="margin: auto; border-collapse: collapse; width: 90%; border: 1px solid black;">
          <thead>
            <tr>
              <th *ngFor="let column of columns; let colIndex = index" [attr.style]="column.style" (click)="sortTable(colIndex)">
                {{ column.header }}
                <span *ngIf="sortColumn === colIndex">{{ sortDirection === 'asc' ? '▲' : '▼' }}</span>
                <span *ngIf="sortColumn !== colIndex" style="visibility: hidden;">▲</span>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of rows; let rowIndex = index">
              <ng-container *ngFor="let cell of row; let colIndex = index">
                <td [ngStyle]="{'border': '1px solid black', 'background-color': cell.styles.fillColor}">
                  {{ cell.content }}
                </td>
              </ng-container>
            </tr>
          </tbody>
        </table>
      </div>
      
      <!-- Loader Section -->
      <div *ngIf="loading" style="display: flex; justify-content: center; align-items: center; height: 300px; position: relative;">
        <div style="text-align: center;">
          <p>Loading data...</p>
          <div class="spinner-border text-primary" role="status" style="display: inline-block;">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>
      

    </div>
  </div>
</div>
</div>

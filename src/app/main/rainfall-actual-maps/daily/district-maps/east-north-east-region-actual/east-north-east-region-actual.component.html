<div class="wholebody">
    <app-header></app-header>
  
    <div class="pt-3 pb-1">
      <div class="values container shadow-lg">
        <div class="row g-3 align-items-end">
          <div class="col-md-8">
            <label class="form-label">Select Date</label>
            <input
              type="date"
              class="form-control"
              [(ngModel)]="fromDate"
              placeholder="Select date"
              [max]="today"
            />
          </div>
          <div class="col-md-4 d-flex justify-content-start">
            <button
              type="button"
              class="btn btn-primary w-100"
              (click)="setFromAndToDate()"
            >
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>
  
    <div class="container">
      <div class="row">
        <div class="col-12" id="mapdiv2Navbar">
          <div class="map-container">
            <div class="map-frame d-flex justify-content-center">
              <div
                id="map-east-north-east"
                class="text-center shadow-sm bg-white"
                style="width: 44rem; height: 58.8rem; padding: 1rem"
              >
                <div
                  style="
                    border: 2px solid black;
                    width: 100%;
                    height: 100%;
                    padding: 2em;
                  "
                  id="border-remove-east-north-east"
                >
                  <div id="loaderNavbar" class="loaderNavbar" *ngIf="isLoading">
                    <div class="loading-message">
                      <i class="fa fa-spinner fa-pulse fa-3x fa-fw"></i>
                      Downloading...
                    </div>
                  </div>
  
                  <div class="d-flex w-100">
                    <div class="text-center ms-2" style="width: 15%">
                      <img
                        id="logoImage-east-north-east"
                        class=""
                        src="/assets/images/IMDlogo_Ipart-iris.png"
                        alt=""
                      />
                      <div *ngIf="!isFullscreen()" class="download-buttons">
                        <div
                          id="all-btn-stateNavbar"
                          class="d-flex flex-column mt-3"
                        >
                          <button
                            mat-button
                            class="mode-button mb-2"
                            (click)="downloadMapImage(false)"
                          >
                            Map Download
                          </button>
                          <button
                            mat-button
                            class="mode-button mb-2"
                            (click)="downloadMappdf()"
                          >
                            Map Pdf Download
                          </button>
                          <button
                            mat-button
                            class="mode-button mb-2"
                            (click)="downloadMapData()"
                          >
                            Statistics Download
                          </button>
                          <button
                            mat-button
                            class="mode-button mb-2 custom-z-index"
                            (click)="resetMapSmallScreen()"
                          >
                            Reset Position
                          </button>
                        </div>
                      </div>
                    </div>
                    <div
                      id="middle-header-east-north-east"
                      class="text-center pt-3"
                      style="width: 72%"
                    >
                      <div class="d-flex flex-column align-items-center ps-4">
                        <div>
                          <label
                            class="text-black fw-bold"
                            style="font-family: Arial; font-size: 12px"
                          >
                            भारत मौसम विज्ञान विभाग
                            <br>
                            INDIA METEOROLOGICAL DEPARTMENT, NEW DELHI
                            <br>
                            जल मौसम विज्ञान प्रभाग, नई दिल्ली
                            <br>
                            Hydromet Division, New Delhi
                          </label>
                        </div>
                        <div>
                          <label
                            class="text-black fw-bold"
                            style="font-family: Arial; font-size: 14px"
                          >
                            Date : {{ formatteddate }}
                          </label>
  
                        </div>
                        <div>
                          <label
                            class="text-black fw-bold"
                            style="font-family: Arial; font-size: 14px"
                          >
                            DISTRICT RAINFALL ACTUAL MAP-EAST & NORTH EAST
                            India
                          </label>
                        </div>
                      </div>
                    </div>
  
                    <div>
                      <div
                        id="celebrations-east-north-east"
                        class="text-center mt-3 ms-1"
                      >
                        <img
                          class="logo"
                          src="assets/images/IMD150(BGR).png"
                          alt=""
                        />
                      </div>
  
                      <div>
                        <img
                          class="mt-5 ms-1 img-fluid small-img"
                          src="../../assets/images/—Pngtree—compass_6028609.png"
                          alt=""
                          id="compassArrow-east-north-east"
                        />
                      </div>
                    </div>
  
                    <div>
                      <div
                        id="country_values_east-north-east"
                        *ngIf="isFullscreen()"
                        class="text-center mt-3 ms-1"

                      *ngIf="isFullscreen()"
                      id="resetButtonNavbar-east-north-east"

                    >
                      <button

                      id="leaflet-bottom-east-north-east"

                        id="legends-east-north-east"
                        style="width: auto; height: 30px"
                      >
                        <div *ngFor="let item of legendItems" class="d-flex align-items-center me-3">
                          <div
                            [style.background-color]="item.color"
                            class="d-inline-block"
                            style="width: 11px; height: 11px"

                          <div
                            [style.font-size]="item.fontSize"

<div class="main_container_box">
  <div class="filter_box">
    <div class="filter_box_inner d-flex justify-content-center align-items-center">
      <div class="dates_toggle_group">
        <div class="d-flex gap-2 flex-nowrap mb-2">
          <div class="filter-item">
            <label for="startDate" class="form-label mb-0 me-1">Start Date:</label>
            <input type="date" class="form-control"
                   id="startDate"
                   [(ngModel)]="startDate"
                   [max]="maxDate"
                   (change)="onDateOrModeChange()" />
          </div>
          <div class="filter-item">
            <label for="endDate" class="form-label mb-0 me-1">End Date:</label>
            <input type="date" class="form-control"
                   id="endDate"
                   [(ngModel)]="endDate"
                   [max]="maxDate"
                   (change)="onDateOrModeChange()" />
          </div>
        </div>
        <div class="filter-item toggle-row">
          <span class="fw-bold me-1">Actual</span>
          <div class="form-check form-switch m-0">
            <input class="form-check-input" type="checkbox" id="modeToggle"
                   [(ngModel)]="isActual"
                   (change)="onDateOrModeChange()" />
          </div>
          <span class="fw-bold ms-1">Departure</span>
        </div>
      </div>
      <div class="filter-item ms-4 mt-md-0 mt-2">
        <button class="btn btn-outline-primary" (click)="resetMapView()">Reset Map View</button>
      </div>
    </div>
  </div>

  <div class="map_box row g-3">
    <div class="col-md-4">
      <div class="map_card">
        <h5 class="text-center">State Map</h5>
        <div id="state-map" class="comparison-map"></div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="map_card">
        <h5 class="text-center">District Map</h5>
        <div id="district-map" class="comparison-map"></div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="map_card">
        <h5 class="text-center">Block Map</h5>
        <div id="block-map" class="comparison-map"></div>
      </div>
    </div>
  </div>
</div>

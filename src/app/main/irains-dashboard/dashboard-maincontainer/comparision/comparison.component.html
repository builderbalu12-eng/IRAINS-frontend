<div class="comparison-bar container-fluid py-3 bg-light border-bottom">

  <div class="row g-3 align-items-center mb-3">
    <div class="col-auto">
      <label for="startDate" class="form-label mb-0 me-2">Start Date:</label>
      <input type="date" class="form-control"
             id="startDate"
             [(ngModel)]="startDate"
             [max]="maxDate"
             (change)="onDateOrModeChange()" />
    </div>
    <div class="col-auto">
      <label for="endDate" class="form-label mb-0 me-2">End Date:</label>
      <input type="date" class="form-control"
             id="endDate"
             [(ngModel)]="endDate"
             [max]="maxDate"
             (change)="onDateOrModeChange()" />
    </div>
    <div class="col-auto d-flex align-items-center">
      <span class="me-2 fw-bold">Actual</span>
      <div class="form-check form-switch m-0">
        <input class="form-check-input" type="checkbox" id="modeToggle"
               [(ngModel)]="isActual"
               (change)="onDateOrModeChange()" />
      </div>
      <span class="ms-2 fw-bold">Departure</span>
    </div>
    <!-- RESET BUTTON HERE -->
    <div class="col-auto">
      <button class="btn btn-outline-primary" (click)="resetMapView()">
        Reset Map View
      </button>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-4">
      <h5 class="text-center">State Map</h5>
      <div id="state-map" class="comparison-map" style="height: 600px;"></div>
    </div>
    <div class="col-md-4">
      <h5 class="text-center">
        District Map {{
          selectedState ? '(' + selectedState.properties.state_name + ')' : '(All)'
        }}
      </h5>
      <div id="district-map" class="comparison-map" style="height: 600px;"></div>
    </div>
    <div class="col-md-4">
      <h5 class="text-center">
        Block Map {{
          selectedDistrict ? '(' + selectedDistrict.properties.district + ')' : '(All)'
        }}
      </h5>
      <div id="block-map" class="comparison-map" style="height: 600px;"></div>
    </div>
  </div>
</div>

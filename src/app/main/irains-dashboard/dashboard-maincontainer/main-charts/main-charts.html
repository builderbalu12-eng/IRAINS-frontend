<div class="container-fluid">
  <!-- Heading -->
  <div class="card-header bg-gradient text-white border-0 mb-3" style="background-color: #777F87; padding: 0.8rem;">
    <h6 class="mb-0 fw-semibold">RAINFALL STATISTICS GRAPH {{ selectedPlace.name | uppercase }}</h6>
  </div>

  <!-- Mode selector, unit toggle, and filters -->
  <div class="d-flex justify-content-center align-items-center mb-3 gap-3 flex-wrap">
    <!-- Mode Dropdown -->
    <mat-form-field appearance="fill" class="mode-selector">
      <mat-label>Mode</mat-label>
      <mat-select [(ngModel)]="mode" (selectionChange)="onModeChange($event.value)">
        <mat-option value="custom">Custom</mat-option>
        <mat-option value="season">Season</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- <mat-form-field appearance="fill" class="unit-selector">
      <mat-label>Unit</mat-label>
      <mat-select [(ngModel)]="unit" (selectionChange)="onUnitChange($event.value)">
        <mat-option value="mm">mm</mat-option>
        <mat-option value="cm">cm</mat-option>
      </mat-select>
    </mat-form-field> -->

    <!-- Custom Date Pickers -->
    <div *ngIf="mode === 'custom'" class="d-flex align-items-center gap-2">
      <div class="date-picker-wrapper d-flex align-items-center">
        <span class="date-label">Start Date:</span>
        <mat-form-field appearance="fill" class="date-picker">
          <input
            matInput
            [matDatepicker]="startPicker"
            [(ngModel)]="startDateModel"
            (dateChange)="onStartDateChange($event)"
            [max]="maxDate"
            placeholder="DD/MM/YYYY"
          />
          <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="date-picker-wrapper d-flex align-items-center">
        <span class="date-label">End Date:</span>
        <mat-form-field appearance="fill" class="date-picker">
          <input
            matInput
            [matDatepicker]="endPicker"
            [(ngModel)]="endDateModel"
            (dateChange)="onEndDateChange($event)"
            [max]="maxDate"
            placeholder="DD/MM/YYYY"
          />
          <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>
      </div>
    </div>

    <!-- Season and Year Selectors -->
    <div *ngIf="mode === 'season'" class="d-flex align-items-center gap-2">
      <mat-form-field appearance="fill" class="season-selector">
        <mat-label>Season</mat-label>
        <mat-select [(ngModel)]="selectedSeason" (selectionChange)="onSeasonChange($event.value)">
          <mat-option *ngFor="let season of seasons" [value]="season">{{ season }}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="fill" class="year-selector">
        <mat-label>Years</mat-label>
        <mat-select [(ngModel)]="selectedYears" multiple (selectionChange)="onYearsChange($event.value)">
          <mat-option *ngFor="let year of availableYears" [value]="year">{{ year }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Rainfall Filter Buttons (only for custom mode) -->
    <div *ngIf="mode === 'custom'" class="rainfall-filter-buttons d-flex align-items-center gap-2">
      <button
        *ngFor="let filter of rainfallFilters"
        type="button"
        class="btn btn-outline-primary btn-xs"
        [class.active]="selectedRainfallFilter === filter"
        (click)="onRainfallFilterChange(filter)"
        title="Show data with Actual rainfall in {{filter.label}} range"
      >
        {{ filter.label }} - {{ filter.count }}
      </button>
    </div>

    <!-- Custom Range Inputs -->
    <div *ngIf="mode === 'custom' && selectedRainfallFilter?.label === 'Custom'" class="custom-range-inputs d-flex align-items-center gap-2">
      <mat-form-field appearance="fill" class="custom-range-input">
        <mat-label>Min {{ unit }}</mat-label>
        <input
          matInput
          type="number"
          [(ngModel)]="customMin"
          (ngModelChange)="onCustomRangeChange()"
          placeholder="Min"
          min="0"
          step="0.1"
        />
      </mat-form-field>
      <mat-form-field appearance="fill" class="custom-range-input">
        <mat-label>Max {{ unit }}</mat-label>
        <input
          matInput
          type="number"
          [(ngModel)]="customMax"
          (ngModelChange)="onCustomRangeChange()"
          placeholder="Max"
          min="0"
          step="0.1"
        />
      </mat-form-field>
    </div>
  </div>

  <!-- Chart card -->
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-3 position-relative">
      <div *ngIf="isLoading" class="position-absolute top-50 start-50 translate-middle text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      <div *ngIf="noDataMessage" class="no-data-message">
        {{ noDataMessage }}
      </div>
      <chart *ngIf="!noDataMessage && chart" [ngClass]="{'opacity-50': isLoading}" [chart]="chart" style="width: 100%; height: 600px; display: block;"></chart>
    </div>
  </div>
</div>

<div class="container-fluid">
  <!-- Date pickers and filter buttons in a single line -->
  <div class="row g-3 mb-3 align-items-center">
    <div class="col-auto">
      <mat-form-field appearance="fill" style="min-width: 150px;">
        <mat-label>Start Date</mat-label>
        <input
          matInput
          [matDatepicker]="startPicker"
          [(ngModel)]="startDateModel"
          (dateChange)="onStartDateChange($event)"
          [max]="maxDate"
        />
        <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="col-auto">
      <mat-form-field appearance="fill" style="min-width: 150px;">
        <mat-label>End Date</mat-label>
        <input
          matInput
          [matDatepicker]="endPicker"
          [(ngModel)]="endDateModel"
          (dateChange)="onEndDateChange($event)"
          [max]="maxDate"
        />
        <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="col-auto rainfall-filter-buttons d-flex align-items-center gap-2 flex-wrap">
      <button
        *ngFor="let filter of rainfallFilters"
        type="button"
        class="btn btn-outline-primary"
        [class.active]="selectedRainfallFilter === filter"
        (click)="onRainfallFilterChange(filter)"
        style="min-width: 120px;"
        title="Show data with Actual rainfall in {{filter.label}} range"
      >
        {{ filter.label }} recorded days - {{ filter.count }}
      </button>
    </div>
  </div>

  <!-- Chart card -->
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-header bg-gradient text-white border-0">
      <h6 class="mb-0 fw-semibold">RAINFALL GRAPH {{ selectedPlace.name | uppercase }} FROM {{ fromDate }} TO {{ toDate }}</h6>
    </div>
    <div class="card-body p-3 position-relative">
      <div *ngIf="isLoading" class="position-absolute top-50 start-50 translate-middle text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      <div *ngIf="noDataMessage" class="no-data-message">
        {{ noDataMessage }}
      </div>
      <chart *ngIf="!noDataMessage && chart" [ngClass]="{'opacity-50': isLoading}" [chart]="chart" style="width: 100%; height: 600px; display: block;"></chart>
    </div>
  </div>
</div>

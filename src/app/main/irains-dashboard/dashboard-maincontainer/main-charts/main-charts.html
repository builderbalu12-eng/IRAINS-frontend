<div id="loader" class="loader" *ngIf="isLoading">
  <div class="loading-message">
    <i class="fa fa-spinner fa-pulse fa-3x fa-fw"></i> Loading..
  </div>
</div>

<div class="mt-3 mb-0 p-3 bg-light rounded d-flex flex-wrap align-items-center justify-content-start gap-3">

  <mat-form-field appearance="fill" class="me-3" style="min-width: 150px;">
    <mat-label>Select Season</mat-label>
    <mat-select [(ngModel)]="selectedSeason" (selectionChange)="onSeasonChange($event)">
      <mat-option *ngFor="let season of seasons" [value]="season">{{ season }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="fill" class="me-3" style="min-width: 150px;">
    <mat-label>Select Year</mat-label>
    <mat-select [(ngModel)]="selectedYear" (selectionChange)="onYearChange($event)">
      <mat-option *ngFor="let year of years" [value]="year">{{ year }}</mat-option>
    </mat-select>
  </mat-form-field>

  <div class="rainfall-filter-buttons d-flex align-items-center gap-2 flex-wrap">
    <button
      *ngFor="let filter of rainfallFilters"
      type="button"
      class="btn btn-outline-primary"
      [class.active]="selectedRainfallFilter === filter"
      (click)="onRainfallFilterChange(filter)"
      style="min-width: 60px;"
      title="Show data with Actual rainfall in {{filter.label}} range"
    >
      {{ filter.label }}
    </button>
  </div>

</div>

<div class="chart mt-4">
  <h1
    class="heading-title"
    style="font-size: 18px; text-align: center; font-weight: bold; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 8vh;"
  >
    RAINFALL GRAPH
    {{ selectedPlace.name | uppercase }} IN {{ selectedYear }} {{ selectedSeason | uppercase }} SEASON
  </h1>

  <div *ngIf="noDataMessage" class="no-data-message">
    {{ noDataMessage }}
  </div>

  <div *ngIf="!noDataMessage && chart" [chart]="chart"></div>
</div>

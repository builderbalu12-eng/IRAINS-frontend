
<nav class="custom-navbar navbar navbar-expand-lg">
  <div class="container-fluid justify-content-between align-items-center d-flex">

   
    <ul *ngIf="!showComparison" class="navbar-nav flex-row">
      <li *ngFor="let item of navItems" class="nav-item me-2">
        <a class="nav-link nav-btn" [ngClass]="item.active ? 'active' : ''" (click)="onSelectLayer(item.id)">
          {{ item.label }}
        </a>
      </li>
    </ul>



    <div *ngIf="showComparison" class="d-flex align-items-center filter_box_container">
      <div class="d-flex gap-3 flex-nowrap align-items-center">

        
        <div class="filter-item d-flex align-items-center gap-2">
          <label for="startDate" class="form-label mb-0 me-0">Start Date:</label>
          <input type="date" class="form-control" id="startDate" [max]="maxDate" [(ngModel)]="startDate"
            (change)="onFilterChange()" />
        </div>

        
        <div class="filter-item d-flex align-items-center gap-2">
          <label for="endDate" class="form-label mb-0 me-0">End Date:</label>
          <input type="date" class="form-control" id="endDate" [max]="maxDate" [(ngModel)]="endDate"
            (change)="onFilterChange()" />
        </div>

        <!-- Departure/Actual Toggle -->
        <div class="filter-item toggle-row d-flex align-items-center gap-2 fw-bold">
          Departure
          <div class="form-check form-switch m-0">
            <input class="form-check-input" type="checkbox" id="modeToggle" [(ngModel)]="isActual"
              (change)="onFilterChange()" />
          </div>
          Actual
        </div>

        <!-- Reset Button -->
        <div class="filter-item ms-3">
          <button class="btn btn-outline-primary" (click)="onResetMapView()">Reset Map View</button>
        </div>
      </div>
    </div>

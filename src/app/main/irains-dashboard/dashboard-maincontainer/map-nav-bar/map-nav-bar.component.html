    <div *ngIf="!showComparison" class="live-updates-container">
  <div class="liveupdated">
    <i class="fa fa-bell" aria-hidden="true"></i>
    <span>Station Statistics</span>
  </div>
  <div class="marquee">
    <div class="animate-marquee d-flex align-items-center">
      <span>Top 5 station statistics are:</span>
      <ng-container *ngFor="let station of topStations; let first = first">
        <i *ngIf="!first" class="fa fa-diamond mx-2" aria-hidden="true" style="color: #1d4ed8;"></i>
        <span style="font-size: 12px;">{{ station.station_name }} has recorded</span>
        <span style="font-size: 17px;">{{ station.data }} mm</span>
      </ng-container>
    </div>
  </div>
</div>


    <!-- Filter controls when comparison is active -->
    <div *ngIf="showComparison" class="d-flex align-items-center filter_box_container">
      <div class="d-flex gap-3 flex-nowrap align-items-center">
        <div *ngIf="!isActual" class="filter-item d-flex align-items-center gap-2">
          <label for="startDate" class="form-label mb-0 me-0">Start Date:</label>
          <input type="date" class="form-control" id="startDate" [max]="maxDate" [(ngModel)]="startDate" (change)="onFilterChange()" />
        </div>
        <div class="filter-item d-flex align-items-center gap-2">
          <label for="endDate" class="form-label mb-0 me-0">{{ isActual ? 'Select Date:' : 'End Date:' }}</label>
          <input type="date" class="form-control" id="endDate" [max]="maxDate" [(ngModel)]="endDate" (change)="isActual ? onSelectDateChange() : onFilterChange()" />
        </div>
        <div class="filter-item toggle-row d-flex align-items-center gap-2 fw-bold">
          Departure
          <div class="form-check form-switch m-0">
            <input class="form-check-input" type="checkbox" id="modeToggle" [(ngModel)]="isActual" (change)="onToggleActual()" />
          </div>
          Actual
        </div>
        <div class="filter-item ms-3">
          <button class="btn btn-outline-primary" (click)="onResetMapView()">Reset Map View</button>
        </div>
        <div class="filter-item ms-3 position-relative">
          <button class="btn btn-outline-secondary" (click)="toggleFilterPanel($event)" title="Filter">
            Filter <i class="fa fa-filter" aria-hidden="true"></i>
          </button>
          <div #filterPanel class="filter-panel" [class.show]="showFilterPanel">
            <div class="mode-select">
              <label>
                <input type="radio" [(ngModel)]="mode" value="state" (change)="onModeChange()"> State
              </label>
              <label>
                <input type="radio" [(ngModel)]="mode" value="subdivision" (change)="onModeChange()"> Subdivision
              </label>
            </div>
            <div class="level-select">
              <form [formGroup]="levelForm">
                <label class="checkbox-inline">
                  <input type="checkbox" formControlName="country"> Country
                </label>
                <label class="checkbox-inline">
                  <input type="checkbox" formControlName="region"> Region
                </label>
                <label class="checkbox-inline">
                  <input type="checkbox" formControlName="state"> {{ mode === 'state' ? 'State' : 'Subdivision' }}
                </label>
                <label class="checkbox-inline">
                  <input type="checkbox" formControlName="district"> District
                </label>
                <label class="checkbox-inline">
                  <input type="checkbox" formControlName="block"> Block
                </label>
              </form>
            </div>
            <div *ngIf="selectionMessage" class="selection-message" [ngClass]="{'text-danger': selectedCount !== 3}">
              {{ selectionMessage }}
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary btn-sm" (click)="closeFilterPanel()">Close</button>
              <button type="button" class="btn btn-primary btn-sm" (click)="onApply()">Apply Filters</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <button class="btn compare-btn" [ngClass]="{'active': showComparison}" (click)="onToggleComparisonClick()">
      {{ showComparison ? 'Statistics' : 'Compare' }}
    </button>
  </div>
</nav>

<div class="main-body">
  <div class="dashboard-container">

  
    <div class="navbar-row">
      <app-map-nav-bar
        [showComparison]="showComparison"
        (layerSelected)="onLayerSelected($event)"
        (toggleComparison)="onToggleComparison()">
      </app-map-nav-bar>
    </div>


    <ng-container *ngIf="showComparison; else mainContent">
      
      <div class="comparison-row">
        <app-comparison
          [showComparison]="showComparison"
          (closePopup)="onClosePopup()">
        </app-comparison>
      </div>
    </ng-container>

    <ng-template #mainContent>
      <div class="content-row">
       
        <div class="map-column">
          <app-map-dashboardcontainer [selectedLayer]="selectedLayer"></app-map-dashboardcontainer>
        </div>
       
        <div class="charts-column">
          <app-map-charts></app-map-charts>
        </div>
      </div>
    </ng-template>

  </div>
</div>

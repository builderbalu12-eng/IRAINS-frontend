<div class="">
    <table mat-table [dataSource]="subdivisions" class="mat-elevation-z8">
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    
        <ng-container matColumnDef="subdivision">
          <th mat-header-cell *matHeaderCellDef class="font-weight-bold fs-5"> SUBDIVISION </th>
          <td mat-cell *matCellDef="let element" class="fs-6"> {{element.subdivision}} </td>
        </ng-container>
      
        <ng-container matColumnDef="district">
          <th mat-header-cell *matHeaderCellDef class="font-weight-bold fs-5"> DISTRICT </th>
          <td mat-cell *matCellDef="let element" class="fs-6"> {{element.district}} </td>
        </ng-container>
      
        <ng-container matColumnDef="abbreviation">
          <th mat-header-cell *matHeaderCellDef class="font-weight-bold fs-5"> ABBREVIATION </th>
          <td mat-cell *matCellDef="let element" class="fs-6"> {{element.abbreviation}} </td>
        </ng-container>
    </table>
</div>

<div class="page-wrap">
  <div class="page-header mb-4 d-flex justify-content-between align-items-center">
    <div>
      <h4 class="mb-1"><i class="bi bi-globe-americas me-2 text-primary"></i>Region Management</h4>
      <small class="text-muted">Manage region records — {{ regions.length }} total</small>
    </div>
    <button class="btn btn-primary" (click)="openAdd()">
      <i class="bi bi-plus-circle me-1"></i>Add Region
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="card-header">
      <input type="text" class="form-control form-control-sm w-auto d-inline-block"
             placeholder="Search regions..." [(ngModel)]="searchText" />
      <span class="text-muted small ms-3">{{ filtered.length }} results</span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>Code</th><th>Region Name</th><th>Description</th><th>Status</th><th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of filtered">
              <td><span class="badge bg-dark">{{ r.code }}</span></td>
              <td class="fw-semibold">{{ r.name }}</td>
              <td class="text-muted small">{{ r.description }}</td>
              <td><span class="badge" [ngClass]="r.active ? 'bg-success' : 'bg-secondary'">{{ r.active ? 'Active' : 'Inactive' }}</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary me-1" (click)="openEdit(r)"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger" (click)="delete(r)"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
            <tr *ngIf="filtered.length === 0">
              <td colspan="5" class="text-center text-muted py-5"><i class="bi bi-search me-2"></i>No regions found</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop-custom" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0"><i class="bi bi-globe me-2"></i>{{ isEditing ? 'Edit Region' : 'Add Region' }}</h5>
      <button class="btn-close btn-close-white" (click)="closeModal()"></button>
    </div>
    <div class="modal-card-body">
      <form [formGroup]="form">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label fw-bold">Code <span class="text-danger">*</span></label>
            <input class="form-control" formControlName="code" placeholder="e.g. NW" />
          </div>
          <div class="col-md-8">
            <label class="form-label fw-bold">Region Name <span class="text-danger">*</span></label>
            <input class="form-control" formControlName="name" placeholder="Region name" />
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Description</label>
            <input class="form-control" formControlName="description" placeholder="Short description" />
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="active" id="activeCheck" />
              <label class="form-check-label" for="activeCheck">Active</label>
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-card-footer d-flex gap-2 justify-content-end">
      <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary px-4" [disabled]="form.invalid || isSaving" (click)="save()">
        <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1"></span>
        {{ isSaving ? 'Saving...' : (isEditing ? 'Update' : 'Add Region') }}
      </button>
    </div>
  </div>
</div>

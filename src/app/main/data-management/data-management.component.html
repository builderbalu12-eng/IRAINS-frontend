<div class="dm-layout">
  <app-header></app-header>

  <div class="dm-body">

    <!-- SIDEBAR -->
    <nav class="dm-sidebar" [class.collapsed]="!isExpanded"
         (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">

      <!-- Logo / hamburger row -->
      <div class="sb-logo">
        <button class="sb-hamburger" (click)="togglePin()" [title]="isPinned ? 'Unpin sidebar' : 'Pin sidebar open'">
          <i class="bi" [ngClass]="isPinned ? 'bi-x-lg' : 'bi-list'"></i>
        </button>
        <span class="sb-logo-text">Data Management</span>
      </div>

      <!-- Scroll area -->
      <div class="sb-scroll">
        <ng-container *ngFor="let g of menuGroups">

          <!-- Parent -->
          <div class="sb-parent" [class.open]="g.expanded"
               (click)="toggleGroup(g)" [title]="!isExpanded ? g.label : ''">
            <i [class]="g.icon + ' sb-parent-icon'"></i>
            <span class="sb-parent-label">{{ g.label }}</span>
            <i class="bi bi-chevron-down sb-chevron" [class.down]="g.expanded"></i>
          </div>

          <!-- Children -->
          <div class="sb-children" [class.open]="g.expanded">
            <a *ngFor="let item of g.children"
               class="sb-child"
               [routerLink]="item.route"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{exact:false}">
              <i [class]="item.icon"></i>
              <span>{{ item.label }}</span>
            </a>
          </div>

        </ng-container>
      </div>

    </nav>

    <!-- CONTENT -->
    <div class="dm-content flex-grow-1">
      <app-admin-live-users-bar *ngIf="showLiveUsersBar"></app-admin-live-users-bar>
      <div class="dm-page overflow-auto">
        <router-outlet></router-outlet>
      </div>
      <app-admin-page-activity-panel
        *ngIf="activityRoutePath"
        [backendRoutePath]="activityRoutePath"
        [angularPath]="currentAngularPath"
        [pageTitle]="activityPageTitle">
      </app-admin-page-activity-panel>
    </div>

  </div>
</div>

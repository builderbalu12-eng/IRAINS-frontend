<div class="background-effect">
  <app-header></app-header>

  <!-- Loader (shown only while loading) -->
  <div *ngIf="isLoading" class="loader-overlay">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading data, please wait...</p>
  </div>

  <div [class.blurred]="isLoading">
    <div class="d-flex justify-content-center pt-4">
      <div class="row">
        <div class="col">
          <label class="form-label text-white fs-4"
            ><b>Select Rainfall Filter Type </b></label
          >
          <!-- Toggle Buttons for Custom Range and No Range -->
          <div class="btn-group px-3" role="group">
            <button
              type="button"
              class="btn btn-outline-primary"
              [class.active]="isCustomRange"
              (click)="setRangeMode(true)"
            >
              Custom Range
            </button>
            <button
              type="button"
              class="btn btn-outline-primary"
              [class.active]="!isCustomRange"
              (click)="setRangeMode(false)"
            >
              No Range
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="container pt-5">
      <div class="row align-items-end justify-content-center g-3">
        <!-- Select Date -->
        <div class="col-md-3">
          <label class="form-label"><b>Select Date</b></label>
          <input
            type="date"
            class="form-control"
            [(ngModel)]="filterDate"
            name="date"
            placeholder="Select date"
            (change)="onDateChange($event)"
          />
        </div>

        <!-- Rainfall Range (No Range Mode) -->
        <div class="col-md-3" *ngIf="!isCustomRange">
          <label class="form-label"><b>Enter Rainfall Range</b></label>
          <div class="input-group">
            <input
              type="number"
              class="form-control"
              [(ngModel)]="filterRainfall"
              (change)="validateRainfall()"
              name="rainfall"
              placeholder="Enter value"
            />
            <select class="form-select" [(ngModel)]="selectedUnit">
              <option value="mm">mm</option>
              <option value="cm">cm</option>
            </select>
          </div>
        </div>

        <!-- Custom Range Mode -->
        <div class="col-md-3" *ngIf="isCustomRange">
          <label class="form-label"><b>Enter Rainfall Range</b></label>
          <div class="input-group">
            <input
              type="number"
              class="form-control"
              [(ngModel)]="fromRange"
              placeholder="From"
              min="0"
            />
            <input
              type="number"
              class="form-control"
              [(ngModel)]="toRange"
              placeholder="To"
              min="0"
            />
            <select
              class="form-select"
              [(ngModel)]="customRangeUnit"
              (change)="onCustomRangeUnitChange(customRangeUnit)"
            >
              <option value="mm">mm</option>
              <option value="cm">cm</option>
            </select>
          </div>
        </div>

        <!-- Region Dropdown -->
        <div class="col-md-4">
          <label class="form-label"><b>Select Region(s)</b></label>
          <div class="dropdown">
            <button
              class="btn btn-light dropdown-toggle w-100 text-dark text-truncate"
              type="button"
              id="regionDropdown"
              data-bs-toggle="dropdown"
              aria-expanded="false"
              style="max-width: 100%"
            >
              {{ selectedRegionsDisplayShort }}
            </button>
            <ul class="dropdown-menu p-3" aria-labelledby="regionDropdown">
              <li *ngFor="let region of regions">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    [id]="'region' + region.code"
                    [value]="region.code"
                    (change)="onRegionCheckboxChange($event)"
                    [checked]="selectedRegionCodes.includes(region.code)"
                  />
                  <label
                    class="form-check-label text-dark"
                    [for]="'region' + region.code"
                  >
                    {{ region.name }}
                  </label>
                </div>
              </li>
            </ul>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="col-md-2 text-center">
          <button
            type="button"
            class="btn btn-primary w-100"
            (click)="filterData()"
          >
            Submit
          </button>
        </div>
      </div>
    </div>

    <div class="col-6 col-md-8 col-lg-12 mt-5">
      <div class="significantRainfall-table overflow-x-auto px-3">
        <div class="d-flex justify-content-center">
          <h5 class="text-center p-2 font-weight-text">
            Significant Rainfall Data
          </h5>
          <div class="col-md-2 col-sm-6 mb-3">
            <button
              class="btn btn-primary me-2"
              [disabled]="filteredItems.length === 0"
              (click)="exportAsXLSX()"
            >
              Download
            </button>
            <button
              class="btn btn-success"
              [disabled]="filteredItems.length === 0"
              (click)="downloadDoc()"
            >
              Download Doc
            </button>
          </div>
        </div>
        <div>
          <table class="table table-bordered border-dark rounded-3">
            <thead>
              <tr>
                <th>Met Subdivision</th>
                <th>District Name</th>
                <th>Station Name</th>
                <th (click)="sortData('rainFall')">
                  Rainfall ({{ selectedUnit }})
                  <span
                    *ngIf="sortDirection === 'asc' && sortKey === 'rainFall'"
                    >&#9650;</span
                  >
                  <span
                    *ngIf="sortDirection === 'desc' && sortKey === 'rainFall'"
                    >&#9660;</span
                  >
                </th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of filteredItems">
                <td>{{ item.subdiv_name }}</td>
                <td>{{ item.district_name }}</td>
                <td>{{ item.station_name }}</td>
                <td>
                  {{
                    (selectedUnit === "cm"
                      ? item.data / 10
                      : item.data
                    ).toFixed(1)
                  }}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

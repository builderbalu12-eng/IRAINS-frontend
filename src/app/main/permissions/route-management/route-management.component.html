<div class="page-wrap">
  <div class="page-header mb-4 d-flex justify-content-between align-items-center">
    <div>
      <h4 class="mb-1"><i class="bi bi-signpost-2-fill me-2 text-purple"></i>Route Management</h4>
      <small class="text-muted">Control which roles can access each application route</small>
    </div>
    <button class="btn btn-primary" (click)="openAdd()">
      <i class="bi bi-plus-circle me-1"></i>Add Route
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="card-header">
      <input type="text" class="form-control form-control-sm w-auto d-inline-block"
             placeholder="Search routes or roles..." [(ngModel)]="searchText" />
      <span class="text-muted small ms-3">{{ filtered.length }} routes</span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>Path</th>
              <th>Label</th>
              <th>
                <div class="d-flex gap-2">
                  <span *ngFor="let r of availableRoles" class="role-header-badge">{{ r }}</span>
                </div>
              </th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of filtered">
              <td><code class="text-primary">{{ r.path }}</code></td>
              <td class="fw-semibold">{{ r.label }}</td>
              <td>
                <div class="d-flex gap-2">
                  <span *ngFor="let role of availableRoles"
                        class="role-toggle-badge"
                        [class.enabled]="hasRole(r, role)"
                        (click)="toggleRole(r, role)"
                        title="{{ role }}">
                    {{ role }}
                  </span>
                </div>
              </td>
              <td><span class="badge" [ngClass]="r.active ? 'bg-success' : 'bg-secondary'">{{ r.active ? 'Active' : 'Off' }}</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary me-1" (click)="openEdit(r)"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger" (click)="delete(r)"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop-custom" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0"><i class="bi bi-signpost-2 me-2"></i>{{ isEditing ? 'Edit Route' : 'Add Route' }}</h5>
      <button class="btn-close btn-close-white" (click)="closeModal()"></button>
    </div>
    <div class="modal-card-body">
      <form [formGroup]="form">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-bold">Route Path <span class="text-danger">*</span></label>
            <input class="form-control" formControlName="path" placeholder="e.g. /dashboard" />
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Label <span class="text-danger">*</span></label>
            <input class="form-control" formControlName="label" placeholder="Friendly name" />
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Allowed Roles <small class="text-muted">(comma-separated)</small></label>
            <input class="form-control" [(ngModel)]="rolesInput" [ngModelOptions]="{standalone: true}" placeholder="hq, mc, sp, public" />
            <small class="text-muted">Available: hq, mc, sp, public</small>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="active" id="activeRoute" />
              <label class="form-check-label" for="activeRoute">Active</label>
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-card-footer d-flex gap-2 justify-content-end">
      <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary px-4" [disabled]="form.invalid || isSaving" (click)="save()">
        <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1"></span>
        {{ isSaving ? 'Saving...' : (isEditing ? 'Update' : 'Add Route') }}
      </button>
    </div>
  </div>
</div>

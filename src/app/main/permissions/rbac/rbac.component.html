<div class="page-wrap">
  <div class="page-header mb-4">
    <h4 class="mb-1"><i class="bi bi-shield-lock-fill me-2 text-purple"></i>RBAC — Role Based Access Control</h4>
    <small class="text-muted">Configure permissions per role for each module</small>
  </div>

  <div class="row g-4">

    <!-- Role Cards -->
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-header fw-semibold">
          <i class="bi bi-person-badge me-2"></i>Select Role
        </div>
        <div class="list-group list-group-flush">
          <button *ngFor="let r of roles"
                  class="list-group-item list-group-item-action d-flex align-items-center justify-content-between"
                  [class.active]="selectedRole?.role === r.role"
                  (click)="selectRole(r)">
            <div class="d-flex align-items-center gap-2">
              <span class="badge" [ngClass]="'bg-' + r.color">{{ r.role }}</span>
            </div>
            <small class="text-muted">
              {{ viewCount(r) }}/{{ r.permissions.length }} modules
            </small>
          </button>
        </div>
      </div>
    </div>

    <!-- Permission Matrix -->
    <div class="col-lg-8">
      <div class="card shadow-sm" *ngIf="selectedRole">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span class="fw-semibold">
            <i class="bi bi-table me-2"></i>Permissions &mdash;
            <span class="badge" [ngClass]="'bg-' + getSelectedColor()">{{ getSelectedRole() }}</span>
          </span>
          <div class="d-flex gap-2 align-items-center">
            <span *ngIf="saved" class="text-success small"><i class="bi bi-check-circle me-1"></i>Saved</span>
            <button class="btn btn-sm btn-success" (click)="savePermissions()">
              <i class="bi bi-save me-1"></i>Save
            </button>
          </div>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Module</th>
                <th class="text-center">View</th>
                <th class="text-center">Create</th>
                <th class="text-center">Edit</th>
                <th class="text-center">Delete</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let perm of getPermissions()">
                <td class="fw-semibold">{{ perm.module }}</td>
                <td class="text-center">
                  <input type="checkbox" class="form-check-input"
                         [checked]="perm.view"
                         (change)="perm.view = !perm.view" />
                </td>
                <td class="text-center">
                  <input type="checkbox" class="form-check-input"
                         [checked]="perm.create"
                         [disabled]="!perm.view"
                         (change)="perm.create = !perm.create" />
                </td>
                <td class="text-center">
                  <input type="checkbox" class="form-check-input"
                         [checked]="perm.edit"
                         [disabled]="!perm.view"
                         (change)="perm.edit = !perm.edit" />
                </td>
                <td class="text-center">
                  <input type="checkbox" class="form-check-input"
                         [checked]="perm.delete"
                         [disabled]="!perm.view"
                         (change)="perm.delete = !perm.delete" />
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div *ngIf="!selectedRole" class="text-center text-muted py-5">
        <i class="bi bi-shield fs-1 opacity-25"></i>
        <p class="mt-3">Select a role to configure permissions</p>
      </div>
    </div>

  </div>
</div>

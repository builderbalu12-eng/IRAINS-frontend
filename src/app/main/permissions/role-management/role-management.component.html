<div class="page-wrap">
  <div class="page-header mb-4 d-flex justify-content-between align-items-center">
    <div>
      <h4 class="mb-1"><i class="bi bi-person-badge-fill me-2 text-purple"></i>Role Management</h4>
      <small class="text-muted">Define and manage user roles — {{ roles.length }} roles</small>
    </div>
    <button class="btn btn-primary" (click)="openAdd()">
      <i class="bi bi-plus-circle me-1"></i>Add Role
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="card-header">
      <input type="text" class="form-control form-control-sm w-auto d-inline-block"
             placeholder="Search roles..." [(ngModel)]="searchText" />
    </div>
    <div class="card-body p-0">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th>Code</th><th>Role Name</th><th>Description</th><th class="text-center">Users</th><th>Status</th><th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of filtered">
            <td><code class="text-primary fw-bold">{{ r.code }}</code></td>
            <td class="fw-semibold">{{ r.name }}</td>
            <td class="text-muted small">{{ r.description }}</td>
            <td class="text-center"><span class="badge bg-info text-dark">{{ r.userCount }}</span></td>
            <td><span class="badge" [ngClass]="r.active ? 'bg-success' : 'bg-secondary'">{{ r.active ? 'Active' : 'Inactive' }}</span></td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-1" (click)="openEdit(r)"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger" (click)="delete(r)" [disabled]="r.userCount > 0">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop-custom" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0"><i class="bi bi-person-badge me-2"></i>{{ isEditing ? 'Edit Role' : 'Add Role' }}</h5>
      <button class="btn-close btn-close-white" (click)="closeModal()"></button>
    </div>
    <div class="modal-card-body">
      <form [formGroup]="form">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label fw-bold">Code <span class="text-danger">*</span></label>
            <input class="form-control" formControlName="code" placeholder="e.g. hq" />
          </div>
          <div class="col-md-8">
            <label class="form-label fw-bold">Role Name <span class="text-danger">*</span></label>
            <input class="form-control" formControlName="name" placeholder="Role name" />
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Description</label>
            <input class="form-control" formControlName="description" placeholder="Short description" />
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="active" id="activeRole" />
              <label class="form-check-label" for="activeRole">Active</label>
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-card-footer d-flex gap-2 justify-content-end">
      <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary px-4" [disabled]="form.invalid || isSaving" (click)="save()">
        <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1"></span>
        {{ isSaving ? 'Saving...' : (isEditing ? 'Update' : 'Add Role') }}
      </button>
    </div>
  </div>
</div>

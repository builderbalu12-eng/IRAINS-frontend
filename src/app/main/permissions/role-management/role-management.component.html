<div class="ax-page">

  <header class="ax-hero">
    <div>
      <h2><i class="bi bi-person-badge-fill"></i> Role Management</h2>
      <p class="ax-sub">Define and manage user roles. A role with assigned users cannot be deleted.</p>
    </div>
    <div class="ax-hero-actions">
      <button class="ax-btn" (click)="openAdd()"><i class="bi bi-plus-lg"></i> Add role</button>
    </div>
  </header>

  <div class="ax-roles">
    <button class="ax-role" [class.on]="statusFilter === 'all'" (click)="statusFilter = 'all'">
      <strong>{{ roles.length }} roles</strong>
      <small>{{ activeCount }} active · {{ totalUsers }} users</small>
    </button>
    <button class="ax-role" [class.on]="statusFilter === 'active'" (click)="setStatusFilter('active')">
      <strong>{{ activeCount }} active</strong>
      <small>In use</small>
    </button>
    <button class="ax-role" [class.on]="statusFilter === 'off'" (click)="setStatusFilter('off')">
      <strong>{{ roles.length - activeCount }} off</strong>
      <small>Disabled</small>
    </button>
  </div>

  <div class="ax-toolbar">
    <div class="ax-search">
      <i class="bi bi-search"></i>
      <input type="text" [(ngModel)]="searchText" placeholder="Search code, name, or description…" />
    </div>
  </div>

  <div class="ax-chart">
    <table>
      <thead>
        <tr>
          <th class="ax-mod">Role</th>
          <th>Users</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of filtered" [class.dim]="!r.active">
          <td class="ax-mod">
            <div class="ax-mod-inner">
              <span class="ax-code">{{ r.code | uppercase }}</span>
              <div>
                <strong>{{ r.name }}</strong>
                <small>{{ r.description || 'No description' }}</small>
              </div>
            </div>
          </td>
          <td>{{ r.userCount }}</td>
          <td>
            <button type="button" class="ax-status" [class.live]="r.active" (click)="toggleActive(r)">
              {{ r.active ? 'Active' : 'Off' }}
            </button>
          </td>
          <td class="ax-ops">
            <button type="button" (click)="openEdit(r)" title="Edit"><i class="bi bi-pencil"></i></button>
            <button type="button" class="danger" (click)="delete(r)" [disabled]="r.userCount > 0"
                    [title]="r.userCount > 0 ? 'Cannot delete a role with users' : 'Remove'">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <p class="ax-hint" *ngIf="!filtered.length">No roles match this filter.</p>
  </div>
</div>

<div class="modal-backdrop-custom" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0"><i class="bi bi-person-badge me-2"></i>{{ isEditing ? 'Edit role' : 'Add role' }}</h5>
      <button class="btn-close btn-close-white" (click)="closeModal()"></button>
    </div>
    <div class="modal-card-body">
      <form [formGroup]="form">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label fw-bold">Code <span class="text-danger">*</span></label>
            <input class="form-control" formControlName="code" placeholder="e.g. hq" />
          </div>
          <div class="col-md-8">
            <label class="form-label fw-bold">Role name <span class="text-danger">*</span></label>
            <input class="form-control" formControlName="name" placeholder="Role name" />
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Description</label>
            <input class="form-control" formControlName="description" placeholder="Short description" />
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="active" id="activeRole" />
              <label class="form-check-label" for="activeRole">Active</label>
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-card-footer d-flex gap-2 justify-content-end">
      <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary px-4" [disabled]="form.invalid || isSaving" (click)="save()">
        <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1"></span>
        {{ isSaving ? 'Saving...' : (isEditing ? 'Update' : 'Add role') }}
      </button>
    </div>
  </div>
</div>

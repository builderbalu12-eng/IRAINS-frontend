<div class="tn-page">
  <header class="tn-head center">
    <h1><i class="bi bi-people"></i> ROLES MANAGEMENT</h1>
    <button type="button" class="btn-add" (click)="openAdd()">+ Add New Role</button>
  </header>

  <div class="role-grid">
    <article class="role-card" *ngFor="let role of roles" (click)="openEdit(role)">
      <button
        type="button"
        class="role-del"
        [class.blocked]="userCount(role) > 0"
        [title]="userCount(role) > 0 ? 'Assigned to users' : 'Delete role'"
        (click)="remove(role, $event)">
        <i class="bi bi-trash"></i>
      </button>
      <div class="role-top">
        <span class="role-ico"><i class="bi bi-person-fill"></i></span>
        <div>
          <div class="role-title-row">
            <h3>{{ role.name }}</h3>
            <span class="count">{{ userCount(role) }} users</span>
          </div>
          <p>{{ role.description || 'No description' }}</p>
        </div>
      </div>
      <span class="badge" [class.off]="!role.active">{{ role.active ? 'Active' : 'Inactive' }}</span>
    </article>
  </div>

  <p class="empty" *ngIf="!roles.length">No roles yet. Add one to start assigning routes.</p>
</div>

<div class="modal-backdrop" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="roleModalTitle" (click)="$event.stopPropagation()">
    <header class="modal-head">
      <h2 id="roleModalTitle">{{ isEditing ? 'Edit Role' : 'Add New Role' }}</h2>
      <button type="button" class="modal-x" (click)="closeModal()" aria-label="Close">
        <i class="bi bi-x-lg"></i>
      </button>
    </header>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="modal-body">
        <label>Role Name <span>*</span></label>
        <input formControlName="name" placeholder="Role name" />
        <p class="field-err" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">Role name is required.</p>

        <label>Description</label>
        <textarea formControlName="description" rows="3" placeholder="What this role can do"></textarea>

        <label class="check">
          <input type="checkbox" formControlName="active" />
          Role is active
        </label>
      </div>
      <footer class="modal-foot">
        <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary">{{ isEditing ? 'Update Role' : 'Create Role' }}</button>
      </footer>
    </form>
  </div>
</div>

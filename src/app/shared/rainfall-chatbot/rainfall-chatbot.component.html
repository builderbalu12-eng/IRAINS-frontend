<!-- Launcher -->
<button
  type="button"
  class="varsha-fab"
  [class.open]="open"
  (click)="toggle()"
  [attr.aria-expanded]="open"
  aria-label="Open Varsha rainfall assistant"
>
  <span class="fab-orb" aria-hidden="true">
    <span class="fab-ripple"></span>
    <span class="fab-ripple delay"></span>
    <i class="bi" [ngClass]="open ? 'bi-x-lg' : 'bi-cloud-rain-heavy'"></i>
  </span>
  <span class="fab-copy">
    <span class="fab-kicker">iRAINS</span>
    <span class="fab-title">{{ open ? 'Close' : 'Ask Varsha' }}</span>
  </span>
</button>

<!-- Panel -->
<aside class="varsha-panel" [class.open]="open" role="dialog" aria-label="Varsha rainfall assistant">
  <header class="varsha-header">
    <div class="rain-sky" aria-hidden="true">
      <span
        class="drop"
        *ngFor="let d of rainDrops"
        [style.left.%]="d.left"
        [style.animation-delay.s]="d.delay"
        [style.animation-duration.s]="d.duration"
        [style.height.px]="d.height"
      ></span>
      <div class="mist"></div>
    </div>

    <div class="header-row">
      <div class="identity">
        <div class="avatar" aria-hidden="true">
          <i class="bi bi-droplet-fill"></i>
        </div>
        <div>
          <p class="kicker">Rainfall companion</p>
          <h2>Varsha</h2>
          <p class="status">
            <span class="pulse" [class.offline]="ollamaReady === false"></span>
            Live · {{ dataMode }}
            <ng-container *ngIf="fromDate && toDate"> · {{ fromDate }} → {{ toDate }}</ng-container>
          </p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" title="New chat" (click)="clearChat()">
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>
        <button type="button" class="icon-btn" title="Close" (click)="close()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="varsha-body">
    <div
      class="bubble"
      *ngFor="let m of messages; trackBy: trackById"
      [class.user]="m.role === 'user'"
      [class.assistant]="m.role === 'assistant'"
    >
      <div class="bubble-meta" *ngIf="m.role === 'assistant'">
        <i class="bi bi-droplet-half"></i> Varsha · {{ m.time }}
      </div>
      <div class="bubble-meta user-meta" *ngIf="m.role === 'user'">You · {{ m.time }}</div>

      <div class="bubble-text" *ngIf="m.role === 'assistant'">
        <div *ngIf="m.text" [innerHTML]="m.text"></div>
        <ul class="rain-list" *ngIf="m.listItems?.length">
          <li *ngFor="let item of visibleListItems(m)" [innerHTML]="item"></li>
        </ul>
        <div class="list-actions" *ngIf="(m.listItems && m.listItems.length > 5) || m.navLink?.path">
          <button
            type="button"
            class="more-btn"
            *ngIf="m.listItems && m.listItems.length > 5 && !m.listExpanded"
            (click)="expandList(m)"
          >
            …more ({{ hiddenListCount(m) }})
          </button>
          <button
            type="button"
            class="more-btn"
            *ngIf="m.listItems && m.listItems.length > 5 && m.listExpanded"
            (click)="collapseList(m)"
          >
            Show less
          </button>
          <button
            type="button"
            class="nav-open-btn"
            *ngIf="m.navLink?.path"
            (click)="openNavLink(m.navLink!.path)"
            [title]="m.navLink!.path"
          >
            <i class="bi bi-box-arrow-up-right"></i>
            <span>{{ m.navLink!.label }}</span>
          </button>
        </div>
        <div class="clarify-choices" *ngIf="m.choices?.length" [attr.data-clarify-count]="m.choices!.length">
          <button
            type="button"
            class="clarify-btn"
            *ngFor="let c of m.choices"
            (click)="chooseClarification(c)"
            [disabled]="isTyping || c.available === false"
            [class.unavailable]="c.available === false"
            [class.clarify-month]="c.variant === 'month'"
            [class.clarify-year]="c.variant === 'year'"
            [class.clarify-action]="c.variant === 'action'"
            [class.clarify-primary]="c.emphasize === true"
            [title]="c.available === false ? 'Not available yet' : c.label"
          >
            {{ c.label }}
          </button>
        </div>
      </div>
      <div class="bubble-text" *ngIf="m.role === 'user'">{{ m.text }}</div>
    </div>

    <div class="typing" *ngIf="isTyping">
      <span class="typing-avatar"><i class="bi bi-droplet-fill"></i></span>
      <span class="typing-dots">
        <i></i><i></i><i></i>
      </span>
      <span class="typing-label">Varsha is analyzing the data…</span>
    </div>

    <div #messagesEnd></div>
  </div>

  <footer class="varsha-footer">
    <div class="composer">
      <textarea
        #chatInput
        rows="1"
        [(ngModel)]="inputText"
        (keydown)="onKeydown($event)"
        placeholder="Ask rainfall, or Where is monsoon activity?"
        [disabled]="isTyping"
      ></textarea>
      <button
        type="button"
        class="send-btn"
        (click)="send()"
        [disabled]="!inputText.trim() || isTyping"
        aria-label="Send message"
      >
        <i class="bi bi-send-fill"></i>
      </button>
    </div>
    <p class="footer-note">iRAINS rainfall companion</p>
  </footer>
</aside>

<div class="varsha-backdrop" *ngIf="open" (click)="close()"></div>

<mat-toolbar color="primary" class="custom-toolbar">
  <button mat-icon-button (click)="toggleNavbar()">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="toolbar-title">iRAINS PRODUCTS</span>

  <div class="toolbar-center">
    <!-- <button
      mat-button
      (click)="NavigateToDashboad()"
      class="mode-button"
      [ngClass]="{ active: selectedMapType === 'Dashboard' }"
    >
      Dashboard
    </button> -->
    <button
      mat-button
      (click)="selectBlockOrRainfallMaps('RainfallMaps')"
      class="mode-button"
      [ngClass]="{ active: selectedMapType === 'RainfallMaps' }"
    >
      District Rainfall Monitoring Scheme
    </button>
    <button
      mat-button
      (click)="selectBlockOrRainfallMaps('Block')"
      class="mode-button"
      [ngClass]="{ active: selectedMapType === 'Block' }"
    >
      Block Rainfall Monitoring Scheme
    </button>
  </div>
  <span class="toolbar-visitors">
    <!-- <span>DAILY VISITORS - {{ visitorCount || '0' }}</span> -->
    <span>TOTAL VISITORS - {{ totalVisitorCount || '0' }}</span>
  </span>
</mat-toolbar>
<div id="loader" class="loader" *ngIf="isLoading">
  <div class="loading-message">
    <i class="fa fa-spinner fa-pulse fa-3x fa-fw"></i> Loading...
  </div>
</div>

<div *ngIf="showDeleteConfirm" class="delete-confirmation-overlay">
  <div class="delete-confirmation-modal">
    <div class="modal-header">
      <h3>Confirm Delete</h3>
      <button
        class="close-btn"
        (click)="cancelDelete()"
        [disabled]="isDeleting"
      >
        &times;
      </button>
    </div>
    <div class="modal-body">
      <p>Are you sure you want to delete this document?</p>
      <p class="document-name">"{{ documentToDelete?.document_name }}"</p>
      <p class="warning-text">This action cannot be undone.</p>
    </div>
    <div class="modal-footer">
      <button
        class="btn-cancel"
        (click)="cancelDelete()"
        [disabled]="isDeleting"
      >
        Cancel
      </button>
      <button
        class="btn-delete"
        (click)="executeDelete()"
        [disabled]="isDeleting"
      >
        <span *ngIf="!isDeleting">Delete</span>
        <span *ngIf="isDeleting">Deleting...</span>
      </button>
    </div>
  </div>
</div>

<nav [ngClass]="{ open: isNavbarOpen }" class="top">
  <ul class="nav">
    <ng-container *ngFor="let node of navTree" [ngTemplateOutlet]="navNode" [ngTemplateOutletContext]="{ $implicit: node, depth: 0 }"></ng-container>
  </ul>
</nav>

<ng-template #navNode let-node let-depth="depth">
  <li *ngIf="node.path">
    <a
      [class.main_nav]="depth === 0"
      [routerLink]="routerLinkFor(node.path)">
      {{ node.label }}
    </a>
  </li>
  <li *ngIf="!node.path && node.children?.length">
    <a [class.main_nav]="depth === 0">{{ node.label }}</a>
    <ul>
      <ng-container *ngFor="let child of node.children" [ngTemplateOutlet]="navNode" [ngTemplateOutletContext]="{ $implicit: child, depth: depth + 1 }"></ng-container>
    </ul>
  </li>
</ng-template>

<div *ngIf="showPopup" class="popup">
  <button class="close-btn" (click)="cancel()">X</button>
  <!-- <app-upload-file></app-upload-file> -->
  <app-upload-file-pdf></app-upload-file-pdf>
</div>
